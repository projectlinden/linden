info:
  name: No token → 401
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/me"

runtime:
  scripts:
    - type: tests
      code: |-
        test("no token → 401 with a Bearer challenge", function () {
          expect(res.getStatus()).to.equal(401);
          expect(res.getHeader("www-authenticate")).to.include("Bearer");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
