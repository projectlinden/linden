info:
  name: Get it → 200
  type: http
  seq: 3

http:
  method: GET
  url: "{{API_URL}}/circles/{{circleId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // Run "POST /api/v1/circles" first – it sets {{circleId}}
        test("get my circle → 200", function () {
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(200);
        });

        test("it is the circle just created, with its payload", function () {
          expect(res.getBody().id).to.equal(bru.getVar("circleId"));
          expect(res.getBody().payload).to.equal("AEZhbWlseQ==");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
