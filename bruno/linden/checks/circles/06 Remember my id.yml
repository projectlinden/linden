info:
  name: Remember my id
  type: http
  seq: 6

http:
  method: GET
  url: "{{API_URL}}/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The next requests need my own user id (the Keycloak sub)
        if (res.getStatus() === 200) {
          bru.setVar("myUserId", res.getBody().userId);
        }
    - type: tests
      code: |-
        test("my user id is known", function () {
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(200);
          expect(res.getBody().userId).to.match(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
