info:
  name: Create a circle
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/circles"
  body:
    type: json
    data: |-
      {
        "payload": "AEZhbWlseQ=="
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // The fake lock: format version 0, then "Family" – NOT encrypted. Remembered for the other API requests.
        if (res.getStatus() === 201) {
          bru.setVar("circleId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("201", function () {
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
