info:
  name: Leave a circle
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{API_URL}}/circles/{{circleId}}/members/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // If you are the last member, the circle is deleted
        test("204", function () {
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
