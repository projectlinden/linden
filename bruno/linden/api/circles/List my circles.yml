info:
  name: List my circles
  type: http
  seq: 2

http:
  method: GET
  url: "{{API_URL}}/circles"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", function () {
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
