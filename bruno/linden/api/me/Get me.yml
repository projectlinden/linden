info:
  name: Get me
  type: http
  seq: 1

http:
  method: GET
  url: "{{API_URL}}/me"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("200", function () {
          expect(res.getStatus(), res.getHeader("www-authenticate")).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
