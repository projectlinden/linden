info:
  name: GET /api/v1/me
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("every response carries a correlation id", function () {
          const id = res.getHeader("x-correlation-id");
          expect(id, "X-Correlation-Id header").to.be.a("string");
          expect(id).to.match(/^[A-Za-z0-9-]{8,64}$/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
