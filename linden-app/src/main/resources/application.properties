spring.application.name=linden-app
# Login: Spring Boot only validates tokens from the Keycloak realm "linden"; it never logs anyone in.
# See docs/architecture/auth-flow.md
spring.security.oauth2.resourceserver.jwt.issuer-uri=${LINDEN_AUTH_ISSUER_URI:http://localhost:8180/realms/linden}
spring.security.oauth2.resourceserver.jwt.audiences=linden-api
# Monitoring (ADR-0003): Actuator on its own port, never on the public API port.
# Only health and prometheus are exposed - env, heapdump etc. stay closed (they can contain secrets).
management.server.port=${LINDEN_MANAGEMENT_PORT:8081}
management.server.address=${LINDEN_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Log levels (ENGINEERING.md 7): INFO by default, everywhere. DEBUG only on purpose, for one package, through an
# environment variable and a restart - e.g. LOGGING_LEVEL_IO_GITHUB_PROJECTLINDEN=DEBUG. Never TRACE on a server:
# DEBUG/TRACE is where request details end up. JSON format: LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash (containers).
logging.level.root=INFO
logging.level.io.github.projectlinden=INFO
# Database: only the "linden" database, as the non-superuser role "linden" (postgres/init, auth-flow.md).
spring.datasource.url=${LINDEN_DB_URL:jdbc:postgresql://localhost:5432/linden}
spring.datasource.username=${LINDEN_DB_USER:linden}
spring.datasource.password=${LINDEN_DB_PASSWORD:}
# Flyway owns the schema; Hibernate only checks that entities and tables match.
spring.jpa.hibernate.ddl-auto=validate
# No database access while the HTTP response is being written – load what you need in the service.
spring.jpa.open-in-view=false
# Timeouts (ENGINEERING.md 7): a stopped or hanging database gives a quick 503, never a hanging request.
# Pool: wait at most 3 s for a connection (Hikari's default is 30 s); checking an idle connection must be quicker.
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
# Postgres driver, in seconds: open a connection within 3 s, wait at most 30 s for any answer (default: forever).
# Set here and not in the URL, so they stay when LINDEN_DB_URL is overridden.
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=30
