spring.application.name=kreds-app
# Login: Spring Boot only validates tokens from the Keycloak realm "kreds"; it never logs anyone in.
# See docs/architecture/auth-flow.md
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KREDS_AUTH_ISSUER_URI:http://localhost:8180/realms/kreds}
spring.security.oauth2.resourceserver.jwt.audiences=kreds-api
# Monitoring (ADR-0003): Actuator on its own port, never on the public API port.
# Only health and prometheus are exposed - env, heapdump etc. stay closed (they can contain secrets).
management.server.port=${KREDS_MANAGEMENT_PORT:8081}
management.server.address=${KREDS_MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Log levels (ENGINEERING.md 7): INFO by default, everywhere. DEBUG only on purpose, for one package, through an
# environment variable and a restart - e.g. LOGGING_LEVEL_DK_NORDICS_KREDS=DEBUG. Never TRACE on a server:
# DEBUG/TRACE is where request details end up. JSON format: LOGGING_STRUCTURED_FORMAT_CONSOLE=logstash (containers).
logging.level.root=INFO
logging.level.dk.nordics.kreds=INFO
