name: Project rules

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  rules:
    name: Project rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0            # gitleaks scans every commit, not only the last one
          persist-credentials: false

      # Rule: no secrets in Git (ENGINEERING.md § 11). Official gitleaks image (MIT), pinned by tag and digest.
      # Update deliberately: pull the new tag, test it locally, copy its digest here.
      - name: No secrets in Git
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose --no-banner

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Rule: no content in the database – every column classified (VISION.md § 5, ENGINEERING.md § 11).
      # Runs only SchemaClassificationIT against a throwaway Postgres (Testcontainers).
      # Allow list: linden-core/src/test/resources/schema-classification.csv
      - name: No content in the database
        run: >
          ./mvnw --batch-mode --projects linden-core verify
          -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dit.test=SchemaClassificationIT

      # Rule: module boundaries – core knows nothing about HTTP, the API reaches the database only through services
      # (ENGINEERING.md § 5, § 11). Runs only ArchitectureTest – no Spring, no database, a few seconds.
      - name: Module boundaries
        run: >
          ./mvnw --batch-mode --projects linden-app --also-make test
          -Dtest=ArchitectureTest -Dsurefire.failIfNoSpecifiedTests=false
