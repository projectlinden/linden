# Monitoring for Kreds (ADR-0003, ADR-0004). Same project as docker-compose.yml, so it shares its network.
# Start everything:  docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# Kreds only:        docker compose up -d
name: kreds

# YAML anchors only work inside one file, so the log settings are repeated here.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.13.3   # LTS line
    container_name: kreds-prometheus
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d   # ADR-0003: short retention
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/ready" ]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  prometheus-data: